# Overrides de test: los tests corren contra una base PostgreSQL dedicada.
# El resto de las propiedades (JWT, admin seed) se heredan de application.properties.

spring.datasource.url=jdbc:postgresql://localhost:5432/fdlj_test
spring.datasource.username=fdlj
spring.datasource.password=fdlj

spring.jpa.hibernate.ddl-auto=create-drop

# Límite acotado para tests de convocatoria llena (los fixtures convocan hasta 11)
app.match.max-convocados=20
