spring.application.name=fdlj-backend

# JWT
app.jwt.secret=0KWsNuN8Yqcro2/fk2TXqEzyIX/uFDvml7LjMrPV73B0t1XMByoKj5e/lLOMcVp2kPA2boz9E2nbSOKGkYvWsA==
app.jwt.expiration-ms=86400000

spring.datasource.url=jdbc:postgresql://localhost:5432/fdlj
spring.datasource.username=fdlj
spring.datasource.password=fdlj

# Flyway maneja el schema; Hibernate solo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Performance: batch de fetch para mitigar N+1 en asociaciones LAZY
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Admin seed (development only - do not use in production)
app.admin.username=admin
app.admin.email=admin@fdlj.com
app.admin.password=admin123

# Máximo de jugadores convocados por partido
app.match.max-convocados=20