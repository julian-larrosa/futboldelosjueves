spring.application.name=fdlj-backend

# JWT
# Secret para firmar tokens JWT (Base64, >= 64 bytes para HS512).
# En produccion debe definirse la variable de entorno JWT_SECRET.
# El valor por defecto es SOLO para desarrollo, no es un secreto real y no debe usarse en produccion.
app.jwt.secret=${JWT_SECRET:RkRMSi1ERVYtT05MWS1KV1QtU0VDUkVULURPLU5PVC1VU0UtSU4tUFJPRC1BQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFB}
app.jwt.expiration-ms=86400000

spring.datasource.url=jdbc:postgresql://localhost:5432/fdlj
spring.datasource.username=fdlj
spring.datasource.password=fdlj

# Flyway maneja el schema; Hibernate solo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Performance: batch de fetch para mitigar N+1 en asociaciones LAZY
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Admin seed (development only - do not use in production)
# Credenciales configurables por variables de entorno FDLJ_ADMIN_USERNAME / FDLJ_ADMIN_EMAIL / FDLJ_ADMIN_PASSWORD.
# Los valores por defecto son SOLO para desarrollo y no deben usarse en produccion.
app.admin.username=${FDLJ_ADMIN_USERNAME:admin}
app.admin.email=${FDLJ_ADMIN_EMAIL:admin@fdlj.com}
app.admin.password=${FDLJ_ADMIN_PASSWORD:admin123}

# Máximo de jugadores convocados por partido
app.match.max-convocados=20

# Rate limiting básico sobre los endpoints de autenticación (/api/auth/*)
# En produccion ajustar los limites según el trafico esperado.
app.security.auth-rate-limit.enabled=true
app.security.auth-rate-limit.max=20
app.security.auth-rate-limit.window-seconds=60

# Swagger/OpenAPI UI (dev). En produccion deshabilitar app.security.swagger-enabled=false.
app.security.swagger-enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Desactiva Open Session In View: las asociaciones LAZY solo se resuelven dentro de @Transactional.
spring.jpa.open-in-view=false