services:
  postgres:
    image: postgres:16
    container_name: fdlj-postgres
    environment:
      POSTGRES_DB: fdlj
      POSTGRES_USER: fdlj
      POSTGRES_PASSWORD: fdlj
    ports:
      - "5432:5432"
    volumes:
      - fdlj-pgdata:/var/lib/postgresql/data
      - ./docker/init/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdlj -d fdlj"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fdlj-pgdata:
