# Overrides de test: los tests corren contra una base PostgreSQL dedicada.
# El resto de las propiedades (JWT, admin seed) se heredan de application.properties.

spring.datasource.url=jdbc:postgresql://localhost:5432/fdlj_test
spring.datasource.username=fdlj
spring.datasource.password=fdlj

# Flyway crea el schema en fdlj_test (V1-V4); Hibernate no genera schema
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.clean-on-validation-error=true

# EstadÃ­sticas de Hibernate para el QueryCountTest
spring.jpa.properties.hibernate.generate_statistics=true

# LÃ­mite acotado para tests de convocatoria llena (los fixtures convocan hasta 11)
app.match.max-convocados=20

# LÃ­mite alto de rate limiting para no interferir con la suite completa
# (muchos registros/logins por IP dentro de la misma ventana de 60s)
app.security.auth-rate-limit.max=10000
